<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#04060e" />
    <title>Page not found — Rushwanth Varma Indukuri</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #04060e;
        --text: #f4f6ff;
        --muted: #a3adc7;
        --blue: #9cccff;
        --violet: #c4b5fd;
        --border: rgba(157, 177, 255, 0.16);
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse 700px 500px at 15% 0%, rgba(37, 99, 235, 0.22), transparent 65%),
          radial-gradient(ellipse 600px 450px at 95% 15%, rgba(109, 40, 217, 0.18), transparent 65%),
          var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(rgba(148, 163, 255, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 255, 0.055) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000, transparent 75%);
        pointer-events: none;
      }
      main {
        width: min(560px, 100%);
        padding: clamp(2rem, 6vw, 3.5rem);
        border: 1px solid var(--border);
        border-radius: 26px;
        background: rgba(10, 14, 27, 0.68);
        box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(16px);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        margin: 0 auto 1.5rem;
        border: 1px solid rgba(156, 204, 255, 0.3);
        border-radius: 13px;
        background: linear-gradient(145deg, rgba(37, 99, 235, 0.25), rgba(109, 40, 217, 0.2));
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: -0.02em;
      }
      p.kicker {
        margin: 0 0 0.75rem;
        color: var(--blue);
        font-family: 'Cascadia Code', Consolas, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(4rem, 16vw, 7rem);
        font-weight: 600;
        line-height: 0.9;
        letter-spacing: -0.07em;
        background: linear-gradient(115deg, #d8ebff, #9cccff 45%, #c4b5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h2 {
        margin: 1rem 0 0;
        font-size: clamp(1.3rem, 4vw, 1.7rem);
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      p.description {
        margin: 0.85rem auto 0;
        max-width: 42ch;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-top: 1.8rem;
        padding: 0.72rem 1.2rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #2563eb, #6d28d9);
        color: #fff;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 200ms ease, box-shadow 200ms ease;
      }
      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 34px -14px rgba(59, 130, 246, 0.9);
      }
      a:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 3px;
      }
      .note {
        margin-top: 1.5rem;
        color: #8490ad;
        font-family: 'Cascadia Code', Consolas, monospace;
        font-size: 0.62rem;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">RV</div>
      <p class="kicker">Error 404</p>
      <h1>404</h1>
      <h2>This page is off the map.</h2>
      <p class="description">
        The link may be outdated or mistyped. The rest of the portfolio is
        still right where it should be.
      </p>
      <a href="/">
        Back to the portfolio
        <span aria-hidden="true">→</span>
      </a>
      <p class="note">Rushwanth Varma Indukuri</p>
    </main>
  </body>
</html>
